  return (
    <div className="my-profile-dropdown">

            <img src={myProfile.avatar} alt="me" />

        </div>
      </div>

// ─── Reaction Popup ───────────────────────────────────────────────────────────

const ReactionPopup = ({ onReact, onClose }) => {
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  return (
    <div className="reaction-popup" ref={ref}>
      {QUICK_REACTS.map(e => (
        <div key={e} className="react-option" onClick={() => { onReact(e); onClose(); }}>{e}</div>
      ))}
    </div>
  );
};

// ─── Message ──────────────────────────────────────────────────────────────────

const Message = ({ msg, prevMsg, onEdit, onDelete, onReact, onViewProfile, onHoverProfile, onLeaveProfile, currentUserId, allMembers }) => {
  const [isEditing, setIsEditing] = useState(false);
  const [editVal, setEditVal] = useState(msg.text);
  const [showReactPopup, setShowReactPopup] = useState(false);
  
  const isOwn = msg.authorId === currentUserId;
  const member = allMembers.find(m => m.id === msg.authorId) || { avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${msg.author}`, name: msg.author };

  const isGrouped = prevMsg && prevMsg.authorId === msg.authorId;

  const handleSave = () => {
    if (editVal.trim()) onEdit(msg.id, editVal);
    setIsEditing(false);
  };

  return (
    <div className={`message-wrap ${msg.isNew ? 'msg-new' : ''} ${isOwn ? 'msg-own' : ''} ${isGrouped ? 'grouped' : ''}`}>
      {!isGrouped && (
        <div className="msg-avatar" 
             onClick={() => onViewProfile(member)}
             onMouseEnter={(e) => onHoverProfile && onHoverProfile(member, e)}
             onMouseLeave={() => onLeaveProfile && onLeaveProfile()}>
          <img src={member.avatar} alt={member.name} />
        </div>
      )}
      <div className="msg-content">
        {!isGrouped && (
          <div className="msg-meta">
            <span className="msg-author" style={{ color: member.color || (isOwn ? 'var(--accent2)' : 'var(--fg)') }}
              onClick={() => onViewProfile(member)}
              onMouseEnter={(e) => onHoverProfile && onHoverProfile(member, e)}
              onMouseLeave={() => onLeaveProfile && onLeaveProfile()}>
              {msg.author}
            </span>
            <span className="msg-time">{msg.time}</span>
            {msg.edited && <span className="msg-edited">(edited)</span>}
          </div>
        )}
        
        {isEditing ? (
          <>
            <textarea className="edit-input" style={{ resize: 'vertical', minHeight: 60 }} autoFocus value={editVal}
              onChange={e => setEditVal(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSave(); } if (e.key === 'Escape') setIsEditing(false); }} />
            <div className="edit-hint">Enter to save · Escape to cancel</div>
          </>
        ) : (
          <>
            {msg.gifUrl ? (
              <>
                {msg.text && <div className="msg-text">{msg.text}</div>}
                <div className="msg-gif"><img src={msg.gifUrl} alt="gif" /></div>
              </>
            ) : (
              <div className="msg-text">{msg.text}</div>
            )}
          </>
        )}
        {Object.keys(msg.reactions).length > 0 && (
          <div className="reactions">
            {Object.entries(msg.reactions).map(([emoji, data]) => (
              <div key={emoji} className={`reaction-pill ${data.mine ? 'mine' : ''}`}
                onClick={() => onReact(msg.id, emoji)}>
                <span>{emoji}</span>
                <span className="reaction-count">{data.count}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="msg-actions">
        <div className="action-btn" title="React" style={{ position: 'relative' }} onClick={e => { e.stopPropagation(); setShowReactPopup(s => !s); }}>
          <Icon name="smile" size={16} />
          {showReactPopup && <ReactionPopup onReact={emoji => onReact(msg.id, emoji)} onClose={() => setShowReactPopup(false)} />}
        </div>
        {isOwn && <div className="action-btn" title="Edit" onClick={() => setIsEditing(true)}><Icon name="edit" size={16} /></div>}
        {isOwn && <div className="action-btn danger" title="Delete" onClick={() => onDelete(msg.id)}><Icon name="trash" size={16} /></div>}
      </div>
    </div>
  );
};

// ─── DM Chat View ─────────────────────────────────────────────────────────────

const DMChat = ({ member, messages, myProfile, onSend, onEdit, onDelete, onReact, onViewProfile, onHoverProfile, onLeaveProfile, allMembers }) => {
  const [input, setInput] = useState('');
  const [showEmoji, setShowEmoji] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
  }, [messages]);

  const send = (gifUrl) => {
    if (!input.trim() && !gifUrl) return;
    const t = new Date();
    const newMsg = {
      id: `dm_${Date.now()}`,
      authorId: 'me',
      author: myProfile.name,
      text: gifUrl ? (input.trim() || '') : input.trim(),
      gifUrl: gifUrl || null,
      time: `${t.getHours() % 12 || 12}:${String(t.getMinutes()).padStart(2, '0')} ${t.getHours() < 12 ? 'AM' : 'PM'}`,
      reactions: {},
      isNew: true,
    };
    onSend(newMsg);
    setInput('');
    setShowEmoji(false);
  };

  return (
    <div className="dm-chat">
      <header className="header-panel">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 28, height: 28, borderRadius: '50%', overflow: 'hidden', flexShrink: 0 }}>
            <img src={member.avatar} alt={member.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          </div>
          <span>{member.name}</span>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: STATUS_COLORS[member.status], flexShrink: 0 }} />
        </div>
        <div style={{ fontSize: 12, color: 'var(--fg-muted)' }}>{member.status}</div>
      </header>
      <div className="message-list" ref={scrollRef}>
        <div className="welcome-banner">
          <div style={{ cursor: 'pointer' }} onClick={() => onViewProfile(member)}>
            <div style={{ width: 60, height: 60, borderRadius: '50%', overflow: 'hidden', marginBottom: 12 }}>
              <img src={member.avatar} alt={member.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
          </div>
          <div className="welcome-title">{member.name}</div>
          <div className="welcome-sub">{member.handle} · {member.bio}</div>
        </div>
        {messages.map((m, i) => (
          <Message key={m.id} msg={m} prevMsg={i > 0 ? messages[i-1] : null} onEdit={onEdit} onDelete={onDelete} onReact={onReact}
            onViewProfile={onViewProfile} onHoverProfile={onHoverProfile} onLeaveProfile={onLeaveProfile} currentUserId="me" allMembers={allMembers} />
        ))}
      </div>
      <div className="input-container" onClick={() => setShowEmoji(false)}>
        <div className="input-bar" onClick={e => e.stopPropagation()}>
          <div style={{ color: 'var(--fg-muted)', cursor: 'pointer', flexShrink: 0 }}><Icon name="plus" size={22} /></div>
          <input className="input-field" placeholder={`Message ${member.name}`} value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()} />
          <div style={{ color: showEmoji ? 'var(--accent)' : 'var(--fg-muted)', cursor: 'pointer', transition: '0.2s', flexShrink: 0 }}
            onClick={e => { e.stopPropagation(); setShowEmoji(s => !s); }}>
            <Icon name="smile" size={22} />
          </div>
        </div>
        {showEmoji && (
          <div onClick={e => e.stopPropagation()}>
            <EmojiGifPicker
              onSelectEmoji={emoji => { setInput(i => i + emoji); setShowEmoji(false); }}
              onSelectGif={url => { send(url); }}
            />
          </div>
        )}
      </div>
    </div>
  );
};

// ─── App ──────────────────────────────────────────────────────────────────────

const App = () => {
  const [view, setView] = useState('server');
  const [activeDM, setActiveDM] = useState(null); // member id
  const [messages, setMessages] = useState(INITIAL_MESSAGES);
  const [dmMessages, setDmMessages] = useState(INITIAL_DMS);
  const [input, setInput] = useState('');
  const [showEmoji, setShowEmoji] = useState(false);
  const [sideLeftW, setSideLeftW] = useState(240);
  const [sideRightW, setSideRightW] = useState(240);
  const [isDraggingL, setIsDraggingL] = useState(false);
  const [isDraggingR, setIsDraggingR] = useState(false);
  const [viewingProfile, setViewingProfile] = useState(null);
  
  const [hoverUser, setHoverUser] = useState(null);
  const [hoverPos, setHoverPos] = useState({ x: 0, y: 0 });

  const [showMyProfile, setShowMyProfile] = useState(false);
  const [myProfile, setMyProfile] = useState(CURRENT_USER);
  const [rightTab, setRightTab] = useState('members');
  const [toast, setToast] = useState('');
  const scrollRef = useRef(null);
  const allMembers = [...MEMBERS, { ...myProfile, id: 'me' }];

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
  }, [messages]);

  // Drag resize
  useEffect(() => {
    const move = (e) => {
      if (isDraggingL) setSideLeftW(Math.max(160, Math.min(450, e.clientX - 72)));
      if (isDraggingR) setSideRightW(Math.max(160, Math.min(450, window.innerWidth - e.clientX)));
    };
    const up = () => { setIsDraggingL(false); setIsDraggingR(false); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  }, [isDraggingL, isDraggingR]);

  const sendMessage = (gifUrl) => {
    if (!input.trim() && !gifUrl) return;
    const t = new Date();
    const newMsg = {
      id: Date.now(),
      authorId: 'me',
      author: myProfile.name,
      text: gifUrl ? (input.trim() || '') : input.trim(),
      gifUrl: gifUrl || null,
      time: `${t.getHours() % 12 || 12}:${String(t.getMinutes()).padStart(2, '0')} ${t.getHours() < 12 ? 'AM' : 'PM'}`,
      reactions: {},
      isNew: true
    };
    setMessages(prev => [...prev, newMsg]);
    setInput('');
    setShowEmoji(false);
  };

  const editMessage = (id, text) => setMessages(prev => prev.map(m => m.id === id ? { ...m, text, edited: true } : m));
  const deleteMessage = (id) => { setMessages(prev => prev.filter(m => m.id !== id)); showToast('Message deleted'); };

  const reactMessage = (id, emoji) => {
    setMessages(prev => prev.map(m => {
      if (m.id !== id) return m;
      const existing = m.reactions[emoji];
      if (!existing) return { ...m, reactions: { ...m.reactions, [emoji]: { count: 1, mine: true } } };
      if (existing.mine) {
        const newCount = existing.count - 1;
        if (newCount <= 0) {
          const { [emoji]: _, ...rest } = m.reactions;
          return { ...m, reactions: rest };
        }
        return { ...m, reactions: { ...m.reactions, [emoji]: { count: newCount, mine: false } } };
      }
      return { ...m, reactions: { ...m.reactions, [emoji]: { count: existing.count + 1, mine: true } } };
    }));
  };

  const sendDM = (memberId, msg) => {
    setDmMessages(prev => ({ ...prev, [memberId]: [...(prev[memberId] || []), msg] }));
  };

  const editDM = (memberId, id, text) => {
    setDmMessages(prev => ({ ...prev, [memberId]: prev[memberId].map(m => m.id === id ? { ...m, text, edited: true } : m) }));
  };

  const deleteDM = (memberId, id) => {
    setDmMessages(prev => ({ ...prev, [memberId]: prev[memberId].filter(m => m.id !== id) }));
    showToast('Message deleted');
  };

  const reactDM = (memberId, msgId, emoji) => {
    setDmMessages(prev => ({
      ...prev,
      [memberId]: prev[memberId].map(m => {
        if (m.id !== msgId) return m;
        const existing = m.reactions[emoji];
        if (!existing) return { ...m, reactions: { ...m.reactions, [emoji]: { count: 1, mine: true } } };
        if (existing.mine) {
          const newCount = existing.count - 1;
          if (newCount <= 0) { const { [emoji]: _, ...rest } = m.reactions; return { ...m, reactions: rest }; }
          return { ...m, reactions: { ...m.reactions, [emoji]: { count: newCount, mine: false } } };
        }
        return { ...m, reactions: { ...m.reactions, [emoji]: { count: existing.count + 1, mine: true } } };
      })
    }));
  };

  const handleOpenDM = (member) => {
    setActiveDM(member.id);
    setView('dm');
  };

  const handleHoverProfile = (user, e) => {
    setHoverUser(user);
    setHoverPos({ x: e.clientX + 10, y: e.clientY + 10 });
  };

  const handleLeaveProfile = () => {
    setHoverUser(null);
  };

  const onlineMembers = MEMBERS.filter(m => m.status === 'online' || m.status === 'idle');
  const offlineMembers = MEMBERS.filter(m => m.status === 'offline' || m.status === 'dnd');
  const activeDMmember = MEMBERS.find(m => m.id === activeDM);

  const isDmView = view === 'dm' && activeDMmember;

  return (
    <>
      <div className="app-container" onClick={() => { setShowMyProfile(false); setShowEmoji(false); }}>

        {/* Server Rail */}
        <nav className="server-bar" onClick={e => e.stopPropagation()}>
          <div className={`server-btn ${view === 'dm' ? 'active' : ''}`} onClick={() => setView('dm')} title="Home">
            <Icon name="home" size={22} />
          </div>
          <div className="server-divider" />
          <div className={`server-btn ${view === 'server' ? 'active' : ''}`}
            onClick={() => setView('server')} title="OpenCord Server"
            style={{ fontWeight: 800, fontSize: 15, color: 'var(--accent)', background: 'rgba(91,110,245,0.12)' }}>
            OC
          </div>
          <div className="server-btn" style={{ color: 'var(--success)' }} title="Add Server">
            <Icon name="plus" size={22} />
          </div>
        </nav>

        {/* Left Sidebar */}
        <aside className="sidebar" style={{ width: sideLeftW }} onClick={e => e.stopPropagation()}>
          <div className="header-panel">
            <span>{view === 'server' ? '⚡ OpenCord' : 'Direct Messages'}</span>
          </div>
          <div className="scrollable">
            {view === 'server' ? (
              <>
                <div className="section-label">Text Channels</div>
                <div className="item-row active"><Icon name="hash" size={16} /> general-chat</div>
                <div className="item-row"><Icon name="hash" size={16} /> design-critique</div>
                <div className="item-row"><Icon name="hash" size={16} /> dev-talk</div>
                <div className="section-label">Voice</div>
                <div className="item-row"><Icon name="voice" size={16} /> Co-working 1</div>
                <div className="item-row"><Icon name="voice" size={16} /> Gaming Lounge</div>
              </>
            ) : (
              <>
                {MEMBERS.map(m => (
                  <div key={m.id} className={`item-row ${activeDM === m.id ? 'active' : ''}`}
                    onClick={() => handleOpenDM(m)}>
                    <div style={{ position: 'relative', width: 28, height: 28, flexShrink: 0 }}>
                      <div style={{ width: 28, height: 28, borderRadius: '50%', overflow: 'hidden' }}>
                        <img src={m.avatar} alt={m.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                      </div>
                      <div style={{ position: 'absolute', bottom: 0, right: 0, width: 9, height: 9, borderRadius: '50%', background: STATUS_COLORS[m.status], border: '1.5px solid var(--bg-side)' }} />
                    </div>
                    <span>{m.name}</span>
                  </div>
                ))}
              </>
            )}
          </div>

          {/* My User Panel */}
          <div className="user-panel" onClick={(e) => { e.stopPropagation(); setShowMyProfile(p => !p); }}>
            <div className="user-panel-avatar">
              <img src={myProfile.avatar} alt="me" />
              <div className="status-dot" />
            </div>
            <div className="user-panel-info">
              <div className="user-panel-name">{myProfile.name}</div>
              <div className="user-panel-tag">{myProfile.handle}</div>
            </div>
            <div className="user-panel-actions" onClick={e => e.stopPropagation()}>
              <div className="icon-btn" title="Mute"><Icon name="mute" size={16} /></div>
              <div className="icon-btn" title="Headset"><Icon name="headset" size={16} /></div>
              <div className="icon-btn" title="Settings"><Icon name="settings" size={16} /></div>
            </div>
          </div>
        </aside>

        <div className={`resizer ${isDraggingL ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingL(true)} />

        {/* Main content */}
        {isDmView ? (
          <DMChat
            member={activeDMmember}
            messages={dmMessages[activeDMmember.id] || []}
            myProfile={myProfile}
            allMembers={allMembers}
            onSend={msg => sendDM(activeDMmember.id, msg)}
            onEdit={(id, text) => editDM(activeDMmember.id, id, text)}
            onDelete={id => deleteDM(activeDMmember.id, id)}
            onReact={(msgId, emoji) => reactDM(activeDMmember.id, msgId, emoji)}
            onViewProfile={m => setViewingProfile(m)}
            onHoverProfile={handleHoverProfile}
            onLeaveProfile={handleLeaveProfile}
          />
        ) : view === 'dm' ? (
          // DM home - no conversation selected
          <div className="main-chat" style={{ alignItems: 'center', justifyContent: 'center', display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div style={{ fontSize: 40 }}>💬</div>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 18, letterSpacing: '-0.03em' }}>Your Direct Messages</div>
            <div style={{ color: 'var(--fg-muted)', fontSize: 14, textAlign: 'center' }}>Select a conversation from the left sidebar</div>
          </div>
        ) : (
          // Server chat
          <main className="main-chat" onClick={() => setShowEmoji(false)}>
            <header className="header-panel">
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <Icon name="hash" size={20} color="var(--fg-muted)" />
                <span>general-chat</span>
                <span style={{ fontSize: 12, color: 'var(--fg-muted)', fontWeight: 400 }}>· OpenCord community</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <Icon name="voice" size={18} color="var(--fg-muted)" />
                <Icon name="person" size={18} color="var(--fg-muted)" />
              </div>
            </header>

            <div className="message-list" ref={scrollRef}>
              <div className="welcome-banner">
                <div className="welcome-icon">⚡</div>
                <div className="welcome-title">Welcome to #general-chat</div>
                <div className="welcome-sub">This is the start of the #general-chat channel. Say hi!</div>
              </div>
              {messages.map((m, i) => (
                <Message key={m.id} msg={m} prevMsg={i > 0 ? messages[i-1] : null} onEdit={editMessage} onDelete={deleteMessage}
                  onReact={reactMessage} onViewProfile={setViewingProfile}
                  onHoverProfile={handleHoverProfile} onLeaveProfile={handleLeaveProfile}
                  currentUserId="me" allMembers={allMembers} />
              ))}
            </div>

            <div className="input-container" onClick={e => e.stopPropagation()}>
              <div className="input-bar">
                <div style={{ color: 'var(--fg-muted)', cursor: 'pointer', flexShrink: 0 }}><Icon name="plus" size={22} /></div>
                <input className="input-field" placeholder="Message #general-chat" value={input}
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && !e.shiftKey && sendMessage()} />
                <div style={{ color: showEmoji ? 'var(--accent)' : 'var(--fg-muted)', cursor: 'pointer', transition: '0.2s', flexShrink: 0 }}
                  onClick={e => { e.stopPropagation(); setShowEmoji(s => !s); }}>
                  <Icon name="smile" size={22} />
                </div>
              </div>
              {showEmoji && (
                <div onClick={e => e.stopPropagation()}>
                  <EmojiGifPicker
                    onSelectEmoji={emoji => { setInput(i => i + emoji); setShowEmoji(false); }}
                    onSelectGif={url => sendMessage(url)}
                  />
                </div>
              )}
            </div>
          </main>
        )}

        <div className={`resizer ${isDraggingR ? 'dragging' : ''}`} onMouseDown={() => setIsDraggingR(true)} />

        {/* Right Sidebar */}
        <aside className="sidebar" style={{ width: sideRightW }} onClick={e => e.stopPropagation()}>
          <div className="tab-row">
            <div className={`tab-btn ${rightTab === 'members' ? 'active' : ''}`} onClick={() => setRightTab('members')}>Members</div>
            <div className={`tab-btn ${rightTab === 'threads' ? 'active' : ''}`} onClick={() => setRightTab('threads')}>Threads</div>
          </div>
          <div className="scrollable">
            {rightTab === 'members' ? (
              <>
                <div className="section-label">Online — {onlineMembers.length + 1}</div>
                {/* Current user - clicking opens profile card */}
                <div className="member-row" onClick={() => setViewingProfile({ ...myProfile, id: 'me' })}>
                  <div className="member-avatar">
                    <img src={myProfile.avatar} alt={myProfile.name} />
                    <div className="member-status" style={{ background: STATUS_COLORS.online }} />
                  </div>
                  <div>
                    <div className="member-name" style={{ color: 'var(--accent2)' }}>
                      {myProfile.name} <span style={{ fontSize: 10, color: 'var(--fg-muted)', fontFamily: 'var(--font-main)', fontWeight: 400 }}>(you)</span>
                    </div>
                    <div className="member-tag">{myProfile.handle}</div>
                  </div>
                </div>
                {onlineMembers.map(m => (
                  <div key={m.id} className="member-row" onClick={() => setViewingProfile(m)}>
                    <div className="member-avatar">
                      <img src={m.avatar} alt={m.name} />
                      <div className="member-status" style={{ background: STATUS_COLORS[m.status] }} />
                    </div>
                    <div>
                      <div className="member-name" style={{ color: m.color }}>{m.name}</div>
                      <div className="member-tag">{m.status === 'idle' ? '🌙 Idle' : '🟢 Online'}</div>
                    </div>
                  </div>
                ))}
                <div className="section-label" style={{ marginTop: 16 }}>Offline — {offlineMembers.length}</div>
                {offlineMembers.map(m => (
                  <div key={m.id} className="member-row" style={{ opacity: 0.55 }} onClick={() => setViewingProfile(m)}>
                    <div className="member-avatar">
                      <img src={m.avatar} alt={m.name} />
                      <div className="member-status" style={{ background: STATUS_COLORS[m.status] }} />
                    </div>
                    <div>
                      <div className="member-name">{m.name}</div>
                      <div className="member-tag">{m.status === 'dnd' ? '🔴 Do Not Disturb' : '⚫ Offline'}</div>
                    </div>
                  </div>
                ))}
              </>
            ) : (
              <div style={{ padding: '28px 8px', textAlign: 'center', color: 'var(--fg-muted)', fontSize: 14 }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>🧵</div>
                <div style={{ fontFamily: 'var(--font-display)', fontWeight: 600, marginBottom: 6, letterSpacing: '-0.02em' }}>No active threads</div>
                Start a thread from any message.
              </div>
            )}
          </div>
        </aside>
      </div>

      {/* Hover Profile Popover */}
      {hoverUser && <HoverProfile user={hoverUser} position={hoverPos} />}

      {/* My Profile Dropdown */}
      {showMyProfile && (
        <div onClick={e => e.stopPropagation()}>
          <MyProfilePanel myProfile={myProfile} onUpdate={updated => { setMyProfile(updated); showToast('Profile updated ✓'); }} />
        </div>
      )}

      {/* Profile View Modal */}
      {viewingProfile && (
        <ProfileModal user={viewingProfile} onClose={() => setViewingProfile(null)} />
      )}

      {/* Toast */}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
